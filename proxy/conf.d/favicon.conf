location = /web/static/img/favicon.ico {

    set $target_favicon "";
    access_by_lua_block {
        ngx.log(ngx.ERR, os.getenv("DEVMODE"))
        if os.getenv("DEVMODE") == "1" then
            ngx.log(ngx.ERR, "DEVMODE is enabled")
            ngx.var.target_favicon = "http://127.0.0.1:8080/favicon_dev.png"
        else
            ngx.log(ngx.ERR, "DEVMODE is disabled")
            ngx.var.target_favicon = "http://127.0.0.1:8080/favicon_dev1.png"
        end
    }

    proxy_pass $target_favicon;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    #access_log off;
    #log_not_found off; 
}